<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Order Successful</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>

        <header>
            <div class="logo">
                <span class="green">TRACK</span>PANT
            </div>  
            <nav>
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html">Cart 🛒 <span id="cart-count">0</span></a>
                <a href="signup.html">Sign Up</a>
                <a href="login.html">Login</a>
                <button id="darkMode">Dark</button>
                <a href="wishlist.html">Wishlist ❤️</a>
                <a href="orders.html">My Orders</a>
            </nav>
        </header>

        <div class="success-box">

            <h1>✅ Order Placed Successfully!</h1>

            <p>
                Thank you for shopping with TrackPant Store.
            </p>

            <div class="success-buttons">

                <a href="index.html" class="success-btn">Continue Shopping</a>

                <a href="tracking.html" class="success-btn">Track Order</a>

                <a href="invoice.html" class="success-btn">View Invoice</a>

            </div>

        </div>

        <script src="js/theme.js"></script>

        <script>
            // =========================
            // SAVE COMPLETED ORDER
            // =========================

            const cart =
                JSON.parse(localStorage.getItem("cart")) || [];

            const currentUser =
                JSON.parse(localStorage.getItem("currentUser"));

            const orderId =
                localStorage.getItem("orderId");

            const orderDate =
                localStorage.getItem("orderDate");

            const customerName =
                localStorage.getItem("customerName") || "Customer";

            const customerPhone =
                localStorage.getItem("customerPhone") || "";

            const customerAddress =
                localStorage.getItem("customerAddress") || "";

            const paymentMethod =
                localStorage.getItem("paymentMethod") || "";

            const discount =
                Number(localStorage.getItem("discount")) || 0;


            // =========================
            // CREATE ORDER OBJECT
            // =========================

            const newOrder = {

                orderId: orderId,

                orderDate: orderDate,

                customerName: customerName,

                customerPhone: customerPhone,

                customerAddress: customerAddress,

                customerEmail:
                    currentUser ? currentUser.email : "",

                paymentMethod: paymentMethod,

                items: cart,

                discount: discount

            };


            // =========================
            // SAVE TO MY ORDERS
            // =========================

            let orders =
                JSON.parse(localStorage.getItem("orders")) || [];


            // Prevent duplicate order
            const alreadyExists =
                orders.some(order =>
                    order.orderId === orderId
                );


            if (!alreadyExists) {

                orders.push(newOrder);

                localStorage.setItem(
                    "orders",
                    JSON.stringify(orders)
                );

            }


            // =========================
            // SAVE CURRENT ORDER
            // FOR INVOICE
            // =========================

            localStorage.setItem(
                "currentOrder",
                JSON.stringify(newOrder)
            );


            // =========================
            // CLEAR CART DATA
            // AFTER ORDER IS SAVED
            // =========================

            localStorage.removeItem("cart");

            localStorage.removeItem("discount");

            localStorage.removeItem("finalTotal");

        </script>

    </body>
</html>
